<!DOCTYPE html>
<html>
<head>
    <title>Fortune Teller</title>
</head>
<body>
    <h1>Welcome to the Fortune Teller!</h1>
    <p>Fill out the form to discover your future!</p>
    
    <form id="fortuneForm">
        <label for="motherName">What's your mother's first name?</label><br>
        <input type="text" id="motherName" required><br><br>

        <label for="streetName">What's the name of the street you grew up on?</label><br>
        <input type="text" id="streetName" required><br><br>

        <label for="favColour">What was your favorite colour as a child?</label><br>
        <input type="text" id="favColor" required><br><br>

        <label for="currentAge">How old are you now?</label><br>
        <input type="number" id="currentAge" required><br><br>

        <label for="randomNumber">Pick a number from 1 to 10:</label><br>
        <input type="number" id="randomNumber" min="1" max="10" required><br><br>

        <button type="submit">Tell Me My Fortune</button>
    </form>
    
    <h2>Your Future Awaits:</h2>
    <p id="output"></p>

    <script src="beginnerFortune.js"></script>
</body>
</html>
