<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Periodic Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      background-color: #375fc4;
      color: rgb(222, 114, 114);
      padding: 1rem 0;
    }

    main {
      padding: 1rem;
    }

    section {
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      gap: 5px;
    }

    article {
      background-color: #ffff00;
      border: 1px solid #2717d9;
      text-align: center;
      padding: 10px;
      box-sizing: border-box;
      font-size: 0.8rem;
    }

    article:hover {
      background-color: #ddd;
    }

    @media (max-width: 768px) {
      section {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    @media (max-width: 480px) {
      section {
        display: none;
      }

      #fallback {
        display: block;
        text-align: center;
      }
    }

    #fallback {
      display: none;
    }

    footer {
      text-align: center;
      background-color: #4CAF50;
      color: white;
      padding: 1rem 0;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>

    <h1>Periodic Table of Elements</h1>
  </header>
